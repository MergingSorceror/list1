<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>𝓕𝓻𝓮𝓪𝓴𝓵𝓲𝓼𝓽 𝓣𝓸𝓹 𝟐𝟓</title>
<style>
:root{--bg:#f4f5f8;--card:#fff;--text:#14151c;--muted:#6a6f80;--line:#e1e3ea;--accent:#e0245e;--chip:#eceef4;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d0e13;--card:#171923;--text:#eceef6;--muted:#8b90a3;--line:#262a38;--accent:#ff3d7f;--chip:#222534}}
:root[data-theme="dark"]{--bg:#0d0e13;--card:#171923;--text:#eceef6;--muted:#8b90a3;--line:#262a38;--accent:#ff3d7f;--chip:#222534}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:860px;margin:0 auto;padding:20px 16px 48px}
h1{margin:8px 0 2px;font-size:2rem;letter-spacing:-.02em}
h1 span{color:var(--accent)}
.sub{color:var(--muted);margin:0 0 18px}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.tab,select,input{font:inherit;color:var(--text);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 14px}
.tab{cursor:pointer}
.tab.on{background:var(--accent);border-color:var(--accent);color:#fff}
input{flex:1;min-width:140px}
.lvl{display:flex;gap:14px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px;margin-bottom:10px;cursor:pointer}
.lvl:hover{border-color:var(--accent)}
.rank{font-size:1.6rem;font-weight:800;min-width:52px;text-align:center;color:var(--accent)}
.thumb{width:160px;aspect-ratio:16/9;border-radius:8px;flex:none;position:relative;overflow:hidden;background:linear-gradient(135deg,#ff3d7f,#6a3dff)}
.thumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.info{flex:1;min-width:0}
.name{font-weight:700;font-size:1.1rem}
.meta{color:var(--muted);font-size:.9rem}
.pts{font-weight:700;white-space:nowrap}
.chip{display:inline-block;background:var(--chip);border-radius:999px;padding:1px 10px;font-size:.78rem;margin-right:6px}
.detail{display:none;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:-4px 0 12px}
.detail.open{display:block}
.detail a{color:var(--accent)}
.tbl{overflow-x:auto}
table{width:100%;border-collapse:collapse;background:var(--card);border-radius:14px;overflow:hidden}
th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--line)}
th{color:var(--muted);font-size:.8rem;text-transform:uppercase;letter-spacing:.05em}
.empty{color:var(--muted);padding:24px;text-align:center}
@media (max-width:560px){.thumb{width:96px}.pts{display:none}.rank{min-width:38px;font-size:1.2rem}}
</style>
</head>
<body>
<div class="wrap">
  <h1>𝓕𝓻𝓮𝓪𝓴𝓵𝓲𝓼𝓽 <span>𝓣𝓸𝓹 𝟐𝟓</span></h1>
  <p class="sub">The Freak Gang's Hardest Levels</p>
  <div class="bar">
    <button class="tab on" data-v="levels">Levels</button>
    <button class="tab" data-v="players">Players</button>
    <input id="q" type="search" placeholder="Search levels or creators">
    <select id="diff"><option value="">All difficulties</option></select>
  </div>
  <div id="levels"></div>
  <div id="players" class="tbl" hidden></div>
  <p class="sub" style="margin-top:24px">Points per completion = 350 ÷ rank (rounded to 1 decimal). Bernard's project</p>
</div>
<script>
const LEVELS = [
  {name:"Forever New", creator:"Xender Game", verifier:"THATSWHYWEDASH", difficulty:"Hard Demon", video:"ORWlG_mwBfM"},
  {name:"Ultra Violence",   creator:"Creator B", verifier:"Player 2", difficulty:"Medium Demon", video:"tL2X3Fy0BUQ"},
  {name:"B", creator:"motleyorc", verifier:"THATSWHYWEDASH", difficulty:"Medium Demon",  video:"ohKPqGxotao"},
  {name:"Example Level Four",  creator:"Creator D", verifier:"Player 3", difficulty:"Hard Demon",    video:""},
  {name:"Example Level Five",  creator:"Creator E", verifier:"Player 2", difficulty:"Medium Demon",  video:""}
];
// One entry per completion. "level" must match a level name exactly.
const RECORDS = [
  {player:"THATSWHYWEDASH", level:"Example Level One",   proof:""},
  {player:"GOONTOLATINAS", level:"Example Level Three", proof:""},
  {player:"TACOBELLADDICT", level:"Example Level Two",   proof:""},
  {player:"Player 2", level:"Example Level Four",  proof:""},
  {player:"Player 3", level:"Example Level Five",  proof:""}
];
const POINTS = rank => Math.round(3500/rank)/10;
/* ===== END DATA ===== */

const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const rankOf = n => LEVELS.findIndex(l => l.name === n) + 1;

const diffSel = $("#diff");
[...new Set(LEVELS.map(l => l.difficulty))].forEach(d => diffSel.insertAdjacentHTML("beforeend", `<option>${esc(d)}</option>`));

function renderLevels(){
  const q = $("#q").value.toLowerCase(), d = diffSel.value;
  const rows = LEVELS.map((l,i) => ({l, rank:i+1})).filter(({l}) =>
    (!d || l.difficulty === d) && (l.name + " " + l.creator).toLowerCase().includes(q));
  $("#levels").innerHTML = rows.length ? rows.map(({l,rank}) => {
    const beaten = RECORDS.filter(r => r.level === l.name);
    const yt = l.video ? "https://www.youtube.com/watch?v=" + encodeURIComponent(l.video) : "";
    const img = l.video ? `<img alt="" loading="lazy" src="https://img.youtube.com/vi/${encodeURIComponent(l.video)}/mqdefault.jpg" onerror="this.remove()">` : "";
    return `<div class="lvl" data-i="${rank}">
      <div class="rank">#${rank}</div>
      <div class="thumb">${img}</div>
      <div class="info"><div class="name">${esc(l.name)}</div>
        <div class="meta">by ${esc(l.creator)} · verified by ${esc(l.verifier)}</div>
        <div style="margin-top:4px"><span class="chip">${esc(l.difficulty)}</span><span class="chip">${beaten.length} completion${beaten.length===1?"":"s"}</span></div></div>
      <div class="pts">${POINTS(rank)} pts</div></div>
      <div class="detail" id="d${rank}">
        ${yt ? `<p><a href="${yt}" target="_blank" rel="noopener">Watch verification video</a></p>` : ""}
        <strong>Beaten by</strong>
        ${beaten.length ? "<ul>" + beaten.map(r => `<li>${esc(r.player)}${r.proof ? ` (<a href="${esc(r.proof)}" target="_blank" rel="noopener">proof</a>)` : ""}</li>`).join("") + "</ul>" : `<p class="meta">No completions yet.</p>`}
      </div>`;
  }).join("") : `<div class="empty">No levels match your search.</div>`;
}

function renderPlayers(){
  const map = {};
  RECORDS.forEach(r => {
    const rk = rankOf(r.level); if(!rk) return;
    const p = map[r.player] ||= {name:r.player, pts:0, n:0, best:Infinity, bestName:""};
    p.pts += 350/rk; p.n++;
    if(rk < p.best){p.best = rk; p.bestName = r.level;}
  });
  const list = Object.values(map).sort((a,b) => b.pts - a.pts);
  $("#players").innerHTML = list.length ? `<table><thead><tr><th>#</th><th>Player</th><th>Points</th><th>Beaten</th><th>Hardest</th></tr></thead><tbody>` +
    list.map((p,i) => `<tr><td>${i+1}</td><td>${esc(p.name)}</td><td>${(Math.round(p.pts*10)/10)}</td><td>${p.n}</td><td>#${p.best} ${esc(p.bestName)}</td></tr>`).join("") + `</tbody></table>`
    : `<div class="empty">No records yet.</div>`;
}

$("#levels").addEventListener("click", e => {
  const c = e.target.closest(".lvl"); if(!c || e.target.closest("a")) return;
  const d = $("#d" + c.dataset.i); if(d) d.classList.toggle("open");
});
document.querySelectorAll(".tab").forEach(b => b.addEventListener("click", () => {
  document.querySelectorAll(".tab").forEach(x => x.classList.toggle("on", x === b));
  const lv = b.dataset.v === "levels";
  $("#levels").hidden = !lv; $("#players").hidden = lv;
  $("#q").style.display = $("#diff").style.display = lv ? "" : "none";
}));
$("#q").addEventListener("input", renderLevels);
diffSel.addEventListener("change", renderLevels);
renderLevels(); renderPlayers();
</script>
</body>
</html>
